name: attendease
description: Smart Attendance System with BLE, QR, and AI Face Verification.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0

  # Security & Device Lock
  flutter_secure_storage: ^9.0.0
  uuid: ^4.2.1
  crypto: ^3.0.3

  # Bluetooth & QR
  flutter_blue_plus: ^1.31.0
  mobile_scanner: ^4.0.0

  # AI & Camera
  google_mlkit_face_detection: ^0.9.0
  tflite_flutter: ^0.10.4
  camera: ^0.10.5
  image: ^4.1.4
  image_picker: ^1.0.7

  # State Management & Navigation
  provider: ^6.1.1
  go_router: ^13.0.0

  # Offline Support
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^5.0.2

  # UI
  cupertino_icons: ^1.0.6
  flutter_animate: ^4.3.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/models/
